name: Publish
description: >-
  Publish a version: generate notes from BREAKING/feat/fix commits since the
  last release, tag vX.Y.Z, force-move the vN major tag, and cut a GitHub
  Release. For an action already listed on the Marketplace, the listing tracks
  that release automatically. Assumes the caller has checked out with
  fetch-depth 0 and fetch-tags true, and grants the job contents: write.
author: lite-actions

inputs:
  from:
    description: "Base ref/commit for the notes (default: last release tag)."
    required: false
    default: ""
  to:
    description: "Head ref/commit for the notes (default: HEAD)."
    required: false
    default: ""
  version:
    description: "Explicit version, e.g. 1.2.0 (default: computed from commits)."
    required: false
    default: ""
  notes-title:
    description: >-
      Heading for the release notes used as the GitHub Release body. Empty uses
      release-notes' own default, the repository name from GITHUB_REPO. Set it
      to the same value the changelog action uses, or the committed
      RELEASE_NOTES.md and the Release body will disagree.
    required: false
    default: ""
  move-major-tag:
    description: Force-move the vN tag so consumers on @vN get this release.
    required: false
    default: "true"
  github-token:
    description: Token used to create the GitHub Release.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The version released, empty if there was nothing to release.
    value: ${{ steps.notes.outputs.version }}
  released:
    description: "true if a release was created."
    value: ${{ steps.notes.outputs.changed }}

runs:
  using: composite
  steps:
    # See the note in changelog/action.yml — without tags the computed version
    # restarts from 0.0.0, which here would tag a bogus vX.Y.Z and move vN onto
    # it. Only errors when the remote has tags and the checkout does not.
    - name: Verify tags were fetched
      shell: bash
      run: |
        set -euo pipefail
        local_tags="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1 || true)"
        remote_tags="$(git ls-remote --tags origin 'v*.*.*' 2>/dev/null | head -n1 || true)"
        if [ -z "${local_tags}" ] && [ -n "${remote_tags}" ]; then
          echo "::error::The remote has vX.Y.Z tags but none were fetched. The release would be versioned from 0.0.0. Check out with fetch-tags: true — git-checkout does not imply tags at fetch-depth 0."
          exit 1
        fi

    - name: Generate release notes
      id: notes
      uses: lite-actions/release-notes@v1
      with:
        title: ${{ inputs.notes-title }}
        from: ${{ inputs.from }}
        to: ${{ inputs.to }}
        version: ${{ inputs.version }}

    - name: Tag, move major tag, and publish release
      if: steps.notes.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ steps.notes.outputs.version }}
        NOTES_FILE: ${{ steps.notes.outputs.file }}
        MOVE_MAJOR: ${{ inputs.move-major-tag }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        tag="v${VERSION}"
        git tag -a "${tag}" -m "Release ${VERSION}"
        git push origin "${tag}"
        if [ "${MOVE_MAJOR}" = "true" ]; then
          major="v${VERSION%%.*}"
          git tag -f -a "${major}" -m "${major} -> ${VERSION}"
          git push origin -f "${major}"
        fi
        # The generated notes file is the GitHub Release body.
        gh release create "${tag}" --title "${VERSION}" --notes-file "${NOTES_FILE}"

    # A dispatch that does nothing should say so where it can be seen, not in a
    # step log nobody opens. The notice annotation surfaces on the run itself and
    # the summary on the run page.
    - name: No release changes
      if: steps.notes.outputs.changed != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "::notice title=NO RELEASE CHANGES::No BREAKING / feat / fix commits since the last release; nothing was tagged or released."
        {
          echo "## NO RELEASE CHANGES"
          echo
          echo "No BREAKING / feat / fix commits since the last release."
          echo "Nothing was tagged, no GitHub Release was created, and no listing was updated."
        } >> "${GITHUB_STEP_SUMMARY}"
